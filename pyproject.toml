[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pertact"
version = "0.1.0"
description = "Perturbation representations as actions: Norman 2019 data, frozen encoders, baseline embeddings, latent additive decoder"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
